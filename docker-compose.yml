# GardenSeedTracker Docker Compose Configuration
# 
# Usage:
#   Development: docker-compose up
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Environment variables should be set in .env file or passed via command line

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gardenseedtracker
    container_name: garden-seed-tracker
    restart: unless-stopped
    expose:
      - 3000
    environment:
      # Database
      - GST_CATALOG_PATH=${GST_CATALOG_PATH:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - DATABASE_URL=file:/app/data/garden.db
      
      # NextAuth Configuration
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      
      # Email Configuration (for magic links)
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST:-}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT:-587}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER:-}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-Garden Seed Tracker <noreply@gardenseedtracker.com>}
      
      # Cron Security
      - CRON_SECRET=${CRON_SECRET:-}
      
      # Optional: Resend for emails
      #- RESEND_API_KEY=${RESEND_API_KEY:-}
      
      # Optional: Google OAuth
      #- GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      #- GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}

    volumes:
      # Persist SQLite database
      - ${GST_DATA_DIR:-./data}:/app/data
    # Run as root initially to fix volume permissions, then drop to nextjs user
    user: "0:0"
    command: >
      sh -c "chown -R 1001:1001 /app/data && su -s /bin/sh nextjs -c '/app/entrypoint.sh'"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - garden-network

  # Self-hosted installs have no equivalent of Vercel Cron, so this triggers
  # the same daily planting-reminder endpoint from inside the compose network.
  # No-op (with a log message) if CRON_SECRET isn't set.
  scheduler:
    image: curlimages/curl:8.11.0
    container_name: garden-seed-tracker-scheduler
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - CRON_SECRET=${CRON_SECRET:-}
      - REMINDER_URL=http://app:3000/api/cron/planting-reminders
      # 24-hour "HH:MM", in the container's UTC clock
      - REMINDER_TIME=${REMINDER_TIME:-13:00}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$CRON_SECRET" ]; then
          echo "[scheduler] CRON_SECRET is not set - planting reminder emails will not be sent. Set CRON_SECRET in your .env to enable them."
        fi
        echo "[scheduler] Will POST $$REMINDER_URL daily at $$REMINDER_TIME UTC"
        while true; do
          if [ "$(date -u +%H:%M)" = "$$REMINDER_TIME" ] && [ -n "$$CRON_SECRET" ]; then
            echo "[scheduler] Running planting-reminders cron"
            curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" "$$REMINDER_URL" || echo "[scheduler] Request failed"
            sleep 60
          fi
          sleep 30
        done
    networks:
      - garden-network

networks:
  garden-network:
